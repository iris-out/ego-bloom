<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 테마 부트스트랩: 첫 페인트 전에 data-theme 을 정해 플래시를 막는다.
      (function () {
        try {
          var pref = localStorage.getItem('eb-theme') || 'system';
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
          document.documentElement.dataset.theme = resolved;
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = resolved === 'light' ? '#F6F2FC' : '#1B1535';
          document.head.appendChild(meta);
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="preload" as="font" type="font/woff2" href="/fonts/TheJamsil-Bold.woff2" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EGO-BLOOM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
